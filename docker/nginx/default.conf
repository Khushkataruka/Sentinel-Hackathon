# The frontend talks to two services. The API mounts StaticFiles at "/" last,
# so letting it serve the build would swallow every registry route as a 404.
# This table mirrors frontend/vite.config.js.

upstream sentinel_api      { server api:8001; }
upstream sentinel_registry { server registry:8000; }

server {
    listen 8080;
    server_name _;
    client_max_body_size 32m;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;      # SPA routes
    }

    location ~ ^/(search|routes|searches|alerts|violations|traffic|evidence|frames|media|watchlist|map|audit|config)(/|$) {
        proxy_pass http://sentinel_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(cameras|departments|adapters|queues|health|import|sync)(/|$) {
        proxy_pass http://sentinel_registry;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
