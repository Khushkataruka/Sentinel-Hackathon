<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vLLM API Console</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172033}
.wrap{max-width:1100px;margin:0 auto;padding:28px 18px}
h1{margin:0 0 6px;font-size:28px}.sub{color:#667085;margin-bottom:22px}
.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}
.card{background:#fff;border:1px solid #dfe3ea;border-radius:14px;padding:18px}
label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}
input,select,textarea{width:100%;border:1px solid #cfd5df;border-radius:9px;padding:11px 12px;font:inherit;background:#fff}
textarea{min-height:150px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.field{margin-bottom:15px}
.image-picker{border:1px dashed #b9c2d0;border-radius:10px;padding:12px;background:#fafbfc}
.image-preview{display:none;width:100%;max-height:220px;object-fit:contain;border-radius:8px;background:#eef1f6;margin-top:10px}
.file-actions{display:flex;align-items:center;gap:8px;margin-top:8px}
.file-name{font-size:12px;color:#667085;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}
.primary{background:#172033;color:#fff}.secondary{background:#eef1f6;color:#172033}
.actions{display:flex;gap:9px;flex-wrap:wrap}.status{margin-top:12px;font-size:13px;color:#667085}
pre{margin:0;background:#101828;color:#e6edf5;padding:16px;border-radius:10px;overflow:auto;min-height:360px;white-space:pre-wrap;word-break:break-word}
.small{font-size:12px;color:#667085}.endpoint{font-family:ui-monospace,monospace;font-size:12px;background:#f1f3f7;padding:8px;border-radius:7px;margin-bottom:12px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>vLLM API Console</h1>
<div class="sub">OpenAI-compatible API tester for your vLLM server.</div>

<div class="grid">
<section class="card">
<div class="field">
<label for="base">vLLM Base URL</label>
<input id="base" value="http://localhost:8000" placeholder="http://SERVER_IP:8000">
</div>

<div class="field">
<label for="endpoint">Endpoint</label>
<select id="endpoint">
<option value="/v1/chat/completions">POST /v1/chat/completions</option>
<option value="/v1/completions">POST /v1/completions</option>
<option value="/v1/models">GET /v1/models</option>
<option value="/health">GET /health</option>
<option value="/tokenize">POST /tokenize</option>
<option value="/detokenize">POST /detokenize</option>
<option value="/v1/embeddings">POST /v1/embeddings</option>
</select>
</div>

<div class="field" id="modelField">
<label for="model">Model</label>
<input id="model" placeholder="google/gemma-3-27b-it" value="google/gemma-3-27b-it">
</div>

<div class="field" id="promptField">
<label for="prompt">Prompt</label>
<textarea id="prompt">Describe this image in detail.</textarea>
</div>

<div class="field" id="imageField">
<label for="image">Image input</label>
<div class="image-picker">
<input id="image" type="file" accept="image/*">
<img id="imagePreview" class="image-preview" alt="Selected image preview">
<div class="file-actions">
<span class="file-name" id="fileName">No image selected.</span>
<button class="secondary" id="clearImage" type="button">Clear</button>
</div>
</div>
<div class="small">The image is sent as a base64 data URL to the vLLM chat endpoint.</div>
</div>

<div class="row">
<div class="field">
<label for="temperature">Temperature</label>
<input id="temperature" type="number" step="0.1" min="0" max="2" value="0.7">
</div>
<div class="field">
<label for="tokens">Max tokens</label>
<input id="tokens" type="number" min="1" max="32768" value="256">
</div>
</div>

<div class="actions">
<button class="primary" id="send">Send Request</button>
<button class="secondary" id="models">Get Models</button>
<button class="secondary" id="health">Health Check</button>
</div>
<div class="status" id="status">Ready.</div>
</section>

<section class="card">
<label>Request</label>
<div class="endpoint" id="requestLine">POST http://localhost:8000/v1/chat/completions</div>
<pre id="requestView">{}</pre>
<br>
<label>Response</label>
<pre id="response">No request sent yet.</pre>
</section>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const base=()=>$('base').value.trim().replace(/\/+$/,'');
function endpoint(){return $('endpoint').value}
function setStatus(s){$('status').textContent=s}
function updateLine(){$('requestLine').textContent=(endpoint()==='/v1/models'||endpoint()==='/health'?'GET ':'POST ')+base()+endpoint()}
function imageSelected(){return $('image').files[0]||null}
function previewBody(body){
 const copy=JSON.parse(JSON.stringify(body));
 const content=copy.messages&&copy.messages[0]&&copy.messages[0].content;
 if(Array.isArray(content)){
   const imagePart=content.find(part=>part.type==='image_url');
   if(imagePart) imagePart.image_url.url='[base64 image data omitted]';
 }
 return copy;
}
function buildBody(imageUrl=''){
 const ep=endpoint(), model=$('model').value.trim(), text=$('prompt').value, selectedImage=imageSelected();
 if(ep==='/v1/chat/completions'){
   const content=(imageUrl||selectedImage)?[{type:'text',text},{type:'image_url',image_url:{url:imageUrl||'[selected image will be encoded before sending]'}}]:text;
   return {model,messages:[{role:'user',content}],temperature:Number($('temperature').value),max_tokens:Number($('tokens').value),stream:false};
 }
 if(ep==='/v1/completions') return {model,prompt:text,temperature:Number($('temperature').value),max_tokens:Number($('tokens').value),stream:false};
 if(ep==='/v1/embeddings') return {model,input:text};
 if(ep==='/tokenize') return {model,prompt:text};
 if(ep==='/detokenize') return {model,tokens:text.split(',').map(x=>Number(x.trim())).filter(Number.isFinite)};
 return {};
}
function showRequest(body){$('requestView').textContent=JSON.stringify(previewBody(body),null,2)}
function readFileAsDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Could not read the selected image.'));reader.readAsDataURL(file)})}
function updateImagePreview(){
 const file=imageSelected(), preview=$('imagePreview');
 if(!file){preview.removeAttribute('src');preview.style.display='none';$('fileName').textContent='No image selected.';showRequest(buildBody());return}
 preview.src=URL.createObjectURL(file);preview.style.display='block';$('fileName').textContent=file.name;showRequest(buildBody());
}
function setEndpointVisibility(){
 const chat=endpoint()==='/v1/chat/completions';
 $('imageField').style.display=chat?'block':'none';
 $('promptField').querySelector('label').textContent=chat?'Prompt':'Prompt / JSON Body';
}
async function request(path, opts={}){
 const url=base()+path;
 setStatus('Sending...');
 $('response').textContent='Waiting for response...';
 try{
   const r=await fetch(url,opts);
   const ct=r.headers.get('content-type')||'';
   const data=ct.includes('application/json')?await r.json():await r.text();
   $('response').textContent=typeof data==='string'?data:JSON.stringify(data,null,2);
   setStatus(`HTTP ${r.status} ${r.statusText}`);
 }catch(e){
   $('response').textContent='Request failed:\n\n'+e.message+'\n\nIf the server is reachable but the browser blocks the request, enable CORS on vLLM (for example with --allowed-origins) or open this page from an environment permitted by your server.';
   setStatus('Request failed.');
 }
}
$('endpoint').addEventListener('change',()=>{updateLine();setEndpointVisibility();showRequest(buildBody())});
$('base').addEventListener('input',updateLine);
$('model').addEventListener('input',()=>showRequest(buildBody()));
$('prompt').addEventListener('input',()=>showRequest(buildBody()));
$('temperature').addEventListener('input',()=>showRequest(buildBody()));
$('tokens').addEventListener('input',()=>showRequest(buildBody()));
$('image').addEventListener('change',updateImagePreview);
$('clearImage').addEventListener('click',()=>{$('image').value='';updateImagePreview()});

$('send').addEventListener('click',async()=>{
 const ep=endpoint();
 if(ep==='/v1/models'||ep==='/health'){
   showRequest({});
   return request(ep,{method:'GET'});
 }
 const file=imageSelected();
 if(ep==='/v1/chat/completions'&&!file){setStatus('Select an image first.');return}
 let imageUrl='';
 try{if(file) imageUrl=await readFileAsDataUrl(file)}catch(e){setStatus(e.message);return}
 const body=buildBody(imageUrl);
 if(!body.model){setStatus('Enter the model name.');return}
 showRequest(body);
 request(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
});
$('models').addEventListener('click',()=>{ $('endpoint').value='/v1/models';updateLine();setEndpointVisibility();showRequest({});request('/v1/models',{method:'GET'})});
$('health').addEventListener('click',()=>{ $('endpoint').value='/health';updateLine();setEndpointVisibility();showRequest({});request('/health',{method:'GET'})});
setEndpointVisibility();updateLine();showRequest(buildBody());
</script>
</body>
</html>
