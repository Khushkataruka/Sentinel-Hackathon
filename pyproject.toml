[project]
name = "sentinel"
version = "0.1.0"
description = "Integrated Video Management and Analytics Platform - Gujarat Police Innovation Challenge 2026"
requires-python = ">=3.11"
dependencies = [
    "sentinel-core",
    "sentinel-registry",
    "sentinel-ingest",
    "sentinel-pipelines",
    "sentinel-correlation",
    "sentinel-api",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sentinel-core = { workspace = true }
sentinel-registry = { workspace = true }
sentinel-ingest = { workspace = true }
sentinel-pipelines = { workspace = true }
sentinel-correlation = { workspace = true }
sentinel-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
