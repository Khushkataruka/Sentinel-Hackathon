[project]
name = "sentinel"
version = "0.1.0"
description = "Integrated Video Management and Analytics Platform - Gujarat Police Innovation Challenge 2026"
requires-python = ">=3.11"
dependencies = [
    "sentinel-core",
    "sentinel-registry",
    "sentinel-ingest",
    "sentinel-pipelines",
    "sentinel-correlation",
    "sentinel-api",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]
# What it takes to RUN an ONNX model. Small, and enough for the whole platform
# once the .onnx files exist. Declared here and not only on the
# ingest/pipelines packages because `uv sync --all-extras` resolves ROOT
# extras -- a workspace member's extra is never picked up by it, which is why
# onnxruntime was missing from a freshly synced .venv.
models = ["onnxruntime>=1.18"]
# What it takes to MAKE one: ultralytics, which pulls torch, which is a couple
# of gigabytes. Kept separate because someone who already has a yolo.onnx
# should never have to download a training framework to run it.
export = ["ultralytics>=8.2"]
# The ANPR path: ultralytics for the plate detector, easyocr for the reader.
anpr = ["ultralytics>=8.2", "easyocr>=1.7"]
# The rider/helmet and phone detectors, which are ultralytics .pt weights run
# straight rather than exported. Same framework as anpr, no OCR.
violations = ["ultralytics>=8.2"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sentinel-core = { workspace = true }
sentinel-registry = { workspace = true }
sentinel-ingest = { workspace = true }
sentinel-pipelines = { workspace = true }
sentinel-correlation = { workspace = true }
sentinel-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
