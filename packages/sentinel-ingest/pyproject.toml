[project]
name = "sentinel-ingest"
version = "0.1.0"
description = "Camera ingest: adapters, PTS-driven decode, detection, tracking, sighting stubs, traffic buckets"
requires-python = ">=3.11"
dependencies = ["sentinel-core", "numpy>=1.26", "opencv-python-headless>=4.10", "httpx>=0.27"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.18"]
onnx-gpu = ["onnxruntime-gpu>=1.18"]

[project.scripts]
sentinel-ingest = "sentinel.ingest.__main__:main"

[tool.uv.sources]
sentinel-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]
