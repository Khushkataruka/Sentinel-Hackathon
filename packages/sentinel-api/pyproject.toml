[project]
name = "sentinel-api"
version = "0.1.0"
description = "Dashboard API: map, search, routes, alerts, traffic, evidence"
requires-python = ">=3.11"
dependencies = ["sentinel-core", "sentinel-correlation", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
sentinel-api = "sentinel.api.__main__:main"

[tool.uv.sources]
sentinel-core = { workspace = true }
sentinel-correlation = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]
