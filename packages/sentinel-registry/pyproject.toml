[project]
name = "sentinel-registry"
version = "0.1.0"
description = "Central registry: departments, cameras, capability profiles, adapters, health"
requires-python = ">=3.11"
dependencies = ["sentinel-core", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "openpyxl>=3.1", "python-multipart>=0.0.9"]

[project.scripts]
sentinel-registry = "sentinel.registry.__main__:main"

[tool.uv.sources]
sentinel-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]
