[project]
name = "sentinel-pipelines"
version = "0.1.0"
description = "Crop pipelines: description, appearance embedding, plate reading, traffic violations"
requires-python = ">=3.11"
dependencies = ["sentinel-core", "numpy>=1.26", "opencv-python-headless>=4.10"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.18"]

[project.scripts]
sentinel-pipeline = "sentinel.pipelines.__main__:main"

[tool.uv.sources]
sentinel-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]
