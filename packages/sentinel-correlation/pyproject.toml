[project]
name = "sentinel-correlation"
version = "0.1.0"
description = "Candidate search, route building, deterministic scoring, watchlist alerts"
requires-python = ">=3.11"
dependencies = ["sentinel-core", "numpy>=1.26"]

[project.scripts]
sentinel-correlation = "sentinel.correlation.__main__:main"

[tool.uv.sources]
sentinel-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]
